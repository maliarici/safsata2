
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Safsata Türünü Bul</title>
  <link rel="icon" type="image/x-icon" href="./gantep.ico?v=2">

  <style>
    :root {
      --mor: #69346f;
      --yesil: #17803b;
      --kirmizi: #cf3030;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f5f8;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      max-width: 1050px;
      margin: 0 auto;
      padding: 24px 18px 50px;
    }

    .status {
      background: white;
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-weight: 700;
      box-shadow: 0 3px 12px #0000000b;
    }

    .bar {
      height: 9px;
      background: #e8dfeb;
      border-radius: 100px;
      overflow: hidden;
      margin: 12px 0 22px;
    }

    .bar-fill {
      height: 100%;
      width: 0;
      background: var(--mor);
      transition: width .25s ease;
    }

    .case {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 3px 12px #0000000b;
    }

    .case p {
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.65;
      margin: 0;
    }

    /* YEDİ GÖRSEL BUTON - TEK SATIR */

    .options {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      border: 3px solid #ded5e1;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      min-width: 0;
      box-shadow: 0 3px 10px #0000000b;
      transition:
        border-color .2s,
        background-color .2s,
        transform .15s;
    }

    .option:not(:disabled):not(.wrong):hover {
      border-color: var(--mor);
      transform: translateY(-2px);
    }

    .option:focus-visible,
    .next:focus-visible {
      outline: 3px solid #4b9aff;
      outline-offset: 3px;
    }

    .option img {
      display: block;
      width: 100%;
      height: 145px;
      object-fit: contain;
    }

    /* YANLIŞ CEVAP */

    .option.wrong {
      background: #ffdddd;
      border-color: var(--kirmizi);
      box-shadow: 0 0 0 2px #f5b5b5;
    }

    /* DOĞRU CEVAP */

    .option.correct {
      background: #e7f8eb;
      border-color: var(--yesil);
      box-shadow: 0 0 0 2px #b8eac7;
    }

    .option:disabled {
      cursor: default;
      opacity: 1;
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    .next {
      background: var(--mor);
      color: white;
      padding: 14px 25px;
      border: 0;
      border-radius: 11px;
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
    }

    .next:disabled {
      background: #aaa4ae;
      cursor: not-allowed;
    }

    /* SONUÇ EKRANI */

    .finish {
      display: none;
      background: white;
      border-radius: 16px;
      text-align: center;
      padding: 35px 20px;
      margin-top: 22px;
      box-shadow: 0 3px 12px #0000000b;
    }

    .finish h2 {
      color: var(--mor);
      font-size: 28px;
    }

    .finish p {
      font-size: 21px;
      line-height: 1.6;
    }

    .perfect-message {
      color: var(--yesil);
      font-weight: bold;
      font-size: 24px !important;
    }

    /* TABLET: TEK SATIR VE YATAY KAYDIRMA */

    @media (max-width: 850px) {
      .options {
        grid-template-columns: repeat(7, minmax(112px, 1fr));
        overflow-x: auto;
        padding-bottom: 8px;
        overscroll-behavior-x: contain;
      }

      .option img {
        height: 120px;
      }
    }

    /* TELEFON: TEK SATIR DÜZENİNİ KORU */

    @media (max-width: 550px) {
      main {
        padding: 16px 12px 36px;
      }

      .case {
        padding: 18px;
      }

      .status {
        padding: 13px 14px;
        font-size: 14px;
      }

      .options {
        grid-template-columns: repeat(7, 112px);
        gap: 7px;
      }

      .option {
        padding: 3px;
        border-width: 2px;
        border-radius: 9px;
      }

      .option img {
        width: 100%;
        height: 115px;
        object-fit: contain;
      }
    }
  </style>
</head>

<body>

<main>

  <!-- DURUM VE PUAN -->

  <section class="status">
    <span id="counter">Durum 1 / 13</span>
    <span id="score">İlk denemede doğru: 0</span>
  </section>

  <div class="bar">
    <div class="bar-fill" id="barFill"></div>
  </div>

  <!-- OYUN -->

  <section id="game">

    <article class="case">
      <p id="caseText"></p>
    </article>

    <div id="options" class="options"></div>

    <div class="actions">
      <button id="next" class="next" disabled>
        Sonraki
      </button>
    </div>

  </section>

  <!-- SONUÇ -->

  <section id="finishScreen" class="finish">

    <p id="result"></p>

    <button id="restart" class="next">
      Yeniden Başla
    </button>

  </section>

</main>

<script>

  // YEDİ SAFSATA GÖRSELİ

  const types = [
    {
      key: "bir-bilen",
      name: "Bir Bilen",
      image: "bir-bilen.png"
    },
    {
      key: "cogunluga-basvurma",
      name: "Çoğunluğa Başvurma",
      image: "cogunluga-basvurma.png"
    },
    {
      key: "duygulara-basvurma",
      name: "Duygulara Başvurma",
      image: "duygulara-basvurma.png"
    },
    {
      key: "ispat-yukumlulugu",
      name: "İspat Yükümlülüğü",
      image: "ispat-yukumlulugu.png"
    },
    {
      key: "kaygan-zemin",
      name: "Kaygan Zemin",
      image: "kaygan-zemin.png"
    },
    {
      key: "yanlis-nedensellik",
      name: "Yanlış Nedensellik (Post Hoc)",
      image: "yanlis-nedensellik.png"
    },
    {
      key: "safsata-yok",
      name: "Safsata Yok",
      image: "safsata-yok.png"
    }
  ];

  // 13 GÜNCEL DURUM

  const situations = [

    // DURUM 1 - BİR BİLEN

    {
      text: "Bir üniversitede öğrencilerin ders başarılarını artırmak amacıyla yeni bir ölçme ve değerlendirme sistemi öneriliyor. Sistemin tanıtıldığı toplantıda bir kurul üyesi, uluslararası alanda tanınan ve önemli bilimsel ödüller kazanmış bir fizikçinin de bu sistemi desteklediğini hatırlatarak bilimsel değerlendirmelerine uzun yıllardır güvenilen böyle bir araştırmacının olumlu görüşünün, uygulamanın benimsenmesi konusunda önemli bir dayanak oluşturduğunu savunuyor.",
      answer: "bir-bilen"
    },

    // DURUM 2 - YANLIŞ NEDENSELLİK

    {
      text: "Bir belediye, şehir merkezindeki otobüs hatlarının sefer saatlerini yeniden düzenliyor. Uygulamadan sonraki üç ayda toplu taşıma kullanan yolcu sayısında %18 artış görülüyor. Aynı dönemde akaryakıt fiyatları yükseliyor ve şehir merkezindeki bazı yollar uzun süreli bakım çalışmaları nedeniyle özel araç trafiğine kapatılıyor. Ulaşım dairesi yöneticisi, yolcu sayısındaki artışın yeni sefer düzenine geçilmesinden hemen sonra gerçekleştiğine dikkat çekiyor. Bu gelişmeyi, yapılan düzenlemenin ulaşım alışkanlıkları üzerinde olumlu sonuçlar doğurduğunun önemli bir göstergesi olarak değerlendiriyor.",
      answer: "yanlis-nedensellik"
    },

    // DURUM 3 - SAFSATA YOK

    {
      text: "Bir üniversite kütüphanesinde çalışma alanlarının yetersiz olduğu yönünde öğrenci şikâyetleri artıyor. Yönetim, farklı fakültelerden öğrencilerin katıldığı bir anket düzenliyor ve özellikle sınav dönemlerinde sessiz çalışma alanlarına yönelik talebin yükseldiğini belirliyor. Bunun üzerine az kullanılan toplantı odalarından birinin belirli saatlerde bireysel çalışma alanına dönüştürülmesi öneriliyor. Yönetim, uygulamanın bir dönem denenmesini ve kullanım verilerine göre sürdürülüp sürdürülmeyeceğine karar verilmesini istiyor.",
      answer: "safsata-yok"
    },

    // DURUM 4 - KAYGAN ZEMİN

    {
      text: "Bir üniversitenin akademik kurulunda, çalışan öğrencilerin derslere devamını kolaylaştırmak amacıyla bazı teorik derslerin video kayıtlarının sınırlı süreyle erişime açılması öneriliyor. Kurul üyelerinden biri, başlangıçta yalnızca belirli dersler için düşünülen bu uygulamanın ilerleyen dönemlerde diğer derslere de yayılabileceğine dikkat çekiyor. Öğrencilerin zamanla kayıtları canlı derslerin yerine koymaya başlayacağını, bunun öğretim üyelerinin derslere yaklaşımını da değiştireceğini ve yüz yüze eğitimin giderek ikinci plana düşeceğini ifade ediyor. Bu nedenle önerinin uzun vadeli sonuçlarının dikkate alınmasını istiyor ve uygulamaya karşı çıkıyor.",
      answer: "kaygan-zemin"
    },

    // DURUM 5 - DUYGULARA BAŞVURMA

    {
      text: "Bir belediye, yeni yapılacak spor merkezinin hangi mahallede kurulacağını belirlemek amacıyla nüfus yoğunluğu, ulaşım olanakları ve mevcut tesislerin kullanım oranlarını inceliyor. Toplantıda söz alan bir mahalle muhtarı, çocukluğunda spor yapacak bir yer bulamadığı için yaşadığı güçlükleri anlatıyor. Ardından mahallesindeki çocukların da benzer koşullarda büyüdüğünü belirterek merkezin kendi mahallelerinde kurulmasını talep ediyor.",
      answer: "duygulara-basvurma"
    },

    // DURUM 6 - İSPAT YÜKÜMLÜLÜĞÜ

    {
      text: "Bir teknoloji firması, geliştirdiği yeni aydınlatma sisteminin çalışanların dikkatini ve zihinsel performansını belirgin biçimde artırdığını ileri sürüyor. Bu sistemi satın almayı planlayan kurumun satın alma komisyonu, bu iddiayı destekleyen bağımsız araştırmaları görmek istiyor. Bunun üzerine firma temsilcisi, sistemin performans üzerinde olumsuz bir etkisi olduğunu gösteren herhangi bir araştırmaya bugüne dek rastlanılmadığına dikkat çekiyor. Komisyonun bu konuda farklı bir değerlendirmesi varsa ilgili verileri sunabileceği, mevcut bilgiler ışığında sistemin satın alınmasında herhangi bir sakınca olmadığı bildiriliyor.",
      answer: "ispat-yukumlulugu"
    },

    // DURUM 7 - SAFSATA YOK

    {
      text: "Bir rehabilitasyon merkezinde, hastaların ev egzersizlerini düzenli yapmalarını kolaylaştırmak amacıyla telefon üzerinden hatırlatma mesajları gönderilmeye başlanıyor. İlk dört haftanın sonunda bazı hastaların egzersizlere daha düzenli katıldığı, bazılarında ise belirgin bir değişiklik olmadığı görülüyor. Sorumlu fizyoterapist, bulguların uygulamanın yararlı olabileceğine işaret ederek uygulamanın daha geniş bir grupta karşılaştırmalı olarak değerlendirilmesini öneriyor.",
      answer: "safsata-yok"
    },

    // DURUM 8 - ÇOĞUNLUĞA BAŞVURMA

    {
      text: "Bir rehabilitasyon merkezinde kronik bel ağrısı olan hastalar için kullanılacak egzersiz yöntemleri tartışılıyor. Merkez yöneticisi, belirli bir egzersiz programının ülkedeki çok sayıda rehabilitasyon merkezinde uygulandığını ve fizyoterapistlerin büyük bölümünün bu yöntemi tercih ettiğini belirtiyor. Toplantıda bazı uzmanlar, farklı yöntemlerin etkinliğine ilişkin araştırmaların karşılaştırılmasını öneriyor. Yönetici ise bu çapta benimsenmiş bir programın diğer seçeneklere göre daha başarılı sonuçlar vereceğini ve merkezin bu yöntemi tercih etmesinin yerinde olacağını savunuyor.",
      answer: "cogunluga-basvurma"
    },

    // DURUM 9 - KAYGAN ZEMİN

    {
      text: "Bir hastanenin fizyoterapi biriminde, hastaların ev egzersiz programlarını belirlerken kişisel tercihlerini de dikkate almak amacıyla bazı hareketler arasında seçim yapmalarına izin verilmesi öneriliyor. Birim sorumlusu, başlangıçta belirli hareketlerle sınırlı tutulan bu seçimin zamanla hastaların tedavi programının diğer bölümleri üzerinde de söz sahibi olmak istemelerine yol açabileceğini belirtiyor. Böyle bir gelişmenin klinik kararların uygulanmasını güçleştireceğini ve standart rehabilitasyon yaklaşımlarının zaman içinde önemini kaybedebileceğini düşünüyor. Bu gerekçelerle önerinin kabul edilmesini uygun bulmuyor.",
      answer: "kaygan-zemin"
    },

    // DURUM 10 - YANLIŞ NEDENSELLİK

    {
      text: "Bir hastanede, düşme riskini azaltmak amacıyla rehabilitasyon salonlarının zemin kaplamaları değiştiriliyor. Yeni kaplamaların kullanılmaya başlanmasından sonraki altı ayda hasta düşmelerinde belirgin bir azalma kaydediliyor. Ancak aynı dönemde hastaların gözetiminden sorumlu personel sayısı artırılıyor ve düşme riski yüksek hastalar için yeni takip prosedürleri uygulanıyor. Hastane yöneticisi, düşmelerdeki azalmanın zemin değişikliğinin ardından ortaya çıktığını vurgulayarak bu sonucu, yapılan yatırımın beklenen yararları sağladığının bir göstergesi olarak değerlendiriyor.",
      answer: "yanlis-nedensellik"
    },

    // DURUM 11 - İSPAT YÜKÜMLÜLÜĞÜ

    {
      text: "Bir fizyoterapi merkezinde, yeni geliştirilen bir cihazın kas iyileşmesini mevcut yöntemlerden daha fazla hızlandırdığı iddia ediliyor. Merkezde çalışan bir fizyoterapist, cihazın üstünlüğünü gösteren kontrollü araştırmalar bulunmadığını belirterek iddianın dayanağını soruyor. Cihazı savunan meslektaşı ise daha iyi bir cihaz varsa onu kullanabileceğini söylüyor. Ancak şimdiye kadar kimsenin bu cihazın diğer yöntemlerden daha etkisiz olduğunu gösteren bir araştırma sunmadığını belirterek cihazı kullanmamak için yeterli bir sebep olmadığını ileri sürüyor.",
      answer: "ispat-yukumlulugu"
    },

    // DURUM 12 - SAFSATA YOK

    {
      text: "Bir üniversitenin fizyoterapi bölümünde, kronik diz ağrısı yaşayan hastalar için uzaktan takip uygulamalarının yaygınlaştırılması tartışılıyor. Bir öğretim üyesi, bu yöntemin geleneksel yüz yüze takipten daha etkili olduğuna ilişkin yeterli karşılaştırmalı veri bulunmadığını belirtiyor. Başka bir akademisyen ise yöntemi destekleyen kişinin uluslararası düzeyde tanınmış bir ortopedi cerrahı olduğunu, uzun yıllardır kas-iskelet sistemi hastalıklarıyla ilgilendiğini ve tıp dünyasında saygın bir konuma sahip olduğunu hatırlatıyor. Böyle bir hekimin mesleki deneyimlerine dayanan değerlendirmesinin, yöntemin etkinliği konusunda karar vermek için önemli bir gösterge olduğunu savunuyor.",
      answer: "safsata-yok"
    },

    // DURUM 13 - DUYGULARA BAŞVURMA

    {
      text: "Bir hastanenin yönetim toplantısında, taburcu edilen hastalara sağlanan evde rehabilitasyon hizmetlerinin nasıl genişletileceği tartışılıyor. Yöneticiler, personel kapasitesi, hasta gereksinimleri ve maliyetlere ilişkin farklı seçenekleri değerlendiriyor. Toplantıya katılan bir temsilci, hareket kısıtlılığı nedeniyle evinden çıkamayan yaşlı bir hastanın yaşadığı yalnızlığı ve çaresizliği ayrıntılı biçimde anlatıyor. Bu hastanın yakınlarının yaşadığı üzüntüden de söz ederek katılımcılardan benzer durumda kendi ailelerinden birinin bulunduğunu düşünmelerini istiyor. Anlattığı örneğin hizmetlerin planlanmasında yol gösterici olması gerektiğini belirterek bütün hastalara aynı sıklıkta ev ziyareti yapılmasını savunuyor.",
      answer: "duygulara-basvurma"
    }

  ];

  // OYUN DEĞİŞKENLERİ

  let index = 0;
  let firstTryCorrect = 0;
  let attemptedWrong = false;
  let solved = false;

  const counter = document.getElementById("counter");
  const score = document.getElementById("score");
  const barFill = document.getElementById("barFill");
  const caseText = document.getElementById("caseText");
  const options = document.getElementById("options");
  const next = document.getElementById("next");

  // DURUMU GÖSTER

  function showSituation() {

    solved = false;
    attemptedWrong = false;
    next.disabled = true;

    next.textContent =
      index === situations.length - 1
        ? "Sonucu Gör →"
        : "Sonraki";

    counter.textContent =
      `Durum ${index + 1} / ${situations.length}`;

    score.textContent =
      `İlk denemede doğru: ${firstTryCorrect}`;

    barFill.style.width =
      `${index / situations.length * 100}%`;

    caseText.textContent = situations[index].text;

    options.replaceChildren();

    types.forEach(type => {

      const button = document.createElement("button");
      button.type = "button";
      button.className = "option";
      button.setAttribute("aria-label", type.name);
      button.title = type.name;

      const img = document.createElement("img");
      img.src = type.image;
      img.alt = type.name;

      button.append(img);

      button.addEventListener("click", () => {
        choose(type.key, button);
      });

      options.append(button);

    });
  }

  // CEVAP KONTROLÜ

  function choose(key, button) {

    if (solved) return;

    const correctAnswer = situations[index].answer;

    // YANLIŞ: KIRMIZI YANIP SÖNER

    if (key !== correctAnswer) {

      attemptedWrong = true;

      button.classList.add("wrong");

      clearTimeout(button.flashTimer);

      button.flashTimer = setTimeout(() => {
        button.classList.remove("wrong");
      }, 750);

      next.disabled = true;

      return;
    }

    // DOĞRU: YEŞİL KALIR

    solved = true;

    if (!attemptedWrong) {
      firstTryCorrect++;
    }

    button.classList.remove("wrong");
    button.classList.add("correct");

    score.textContent =
      `İlk denemede doğru: ${firstTryCorrect}`;

    [...options.children].forEach(option => {
      option.disabled = true;
    });

    next.disabled = false;
  }

  // SONRAKİ DURUM

  next.addEventListener("click", () => {

    if (!solved) return;

    index++;

    if (index < situations.length) {

      showSituation();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    } else {

      showResult();

    }
  });

  // SONUÇ EKRANI

  function showResult() {

    document.getElementById("game").style.display = "none";

    document.getElementById("finishScreen").style.display = "block";

    counter.textContent =
      `Durum ${situations.length} / ${situations.length}`;

    barFill.style.width = "100%";

    const result = document.getElementById("result");

    if (firstTryCorrect === situations.length) {

      result.textContent =
        "Tebrikler! Tüm durumları ilk denemede doğru yanıtladınız!";

      result.className = "perfect-message";

    } else {

      result.textContent =
        `${situations.length} durumu tamamladınız. İlk denemede ${firstTryCorrect} doğru yanıt verdiniz.`;

      result.className = "";

    }

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  // YENİDEN BAŞLA

  document.getElementById("restart")
    .addEventListener("click", () => {

      index = 0;
      firstTryCorrect = 0;
      attemptedWrong = false;
      solved = false;

      document.getElementById("game").style.display = "block";
      document.getElementById("finishScreen").style.display = "none";

      showSituation();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    });

  showSituation();

</script>

</body>
</html>
